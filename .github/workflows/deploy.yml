name: Deploy Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - pre-prod
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Building app..."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.ref_name == 'main' && 'production' ||
        github.ref_name == 'pre-prod' && 'pre-prod' ||
        github.ref_name == 'staging' && 'staging' ||
        'development'
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploying to ${{ github.ref_name }}..."